[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-ai-incident-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "asyncpg>=0.29,<1",
  "aiosqlite>=0.20,<1",
  "redis>=5,<7",
  "httpx>=0.27,<1",
  "langgraph>=0.2,<1",
  "langchain-core>=0.3,<1",
  "tenacity>=9,<10",
  "structlog>=24,<26",
  "pyyaml>=6,<7",
]
[project.optional-dependencies]
dev = ["pytest>=8,<9","pytest-asyncio>=0.24,<1","ruff>=0.6,<1","black>=24,<26","mypy>=1.11,<2","coverage>=7,<8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
